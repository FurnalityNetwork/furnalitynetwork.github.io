<!doctype html>
<html lang="fr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contenus Radio — Replay & Streaming</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

  <link rel="icon" type="image/png" href="https://raw.githack.com/FurnalityNetwork/Asset/main/Assets/FAV/Fav%20-%20Furnality.png">
  <link rel="stylesheet" href="https://raw.githack.com/FurnalityNetwork/Asset/main/css/global.css?v=20">
  <link rel="stylesheet" href="https://raw.githack.com/FurnalityNetwork/Asset/main/css/radio.css?v=1">
  <script src="https://raw.githack.com/FurnalityNetwork/Asset/main/js/global.js?v=1"></script>
</head>
<body class="bg-white text-gray-900 antialiased min-h-screen flex flex-col justify-between pb-24">

  <header class="top-nav fixed top-0 z-50 w-full px-6 py-4 md:px-12 bg-white/95 backdrop-blur-md border-b border-gray-200">
    <nav class="relative mx-auto flex max-w-7xl items-center justify-between gap-6" aria-label="Navigation principale">
      <div class="logo-box flex items-center gap-3 select-none flex-shrink-0">
        <a href="https://furnalitynetwork.github.io" class="flex-shrink-0">
          <img src="https://raw.githack.com/FurnalityNetwork/Asset/main/Assets/STD/STUDIO/Furnality%20Logo.svg" alt="Furnality" class="h-7 w-auto object-contain" onerror="this.style.display='none'">
        </a>
        <span class="logo-separator text-xs text-gray-300">|</span>
        <a href="https://furnalitynetwork.github.io/Radio" class="flex-shrink-0">
          <img src="https://raw.githack.com/FurnalityNetwork/Asset/main/Assets/STD/RADIO/RRF/Furnality%20Radio%20-%20Radio.svg" alt="Furnality Radio" class="h-7 w-auto object-contain" onerror="this.style.display='none'">
        </a>
      </div>

      <div class="hidden lg:flex items-center gap-6 xl:gap-8">
        <a href="https://furnalitynetwork.github.io/Radio" class="nav-link text-xs font-bold uppercase tracking-wider text-gray-600 hover:text-black">ACCUEIL RADIO</a>
        <a href="https://furnalitynetwork.github.io/Radio/antennes.html" class="nav-link text-xs font-bold uppercase tracking-wider text-gray-600 hover:text-black">CARTE & ANTENNES</a>
        <a href="https://furnalitynetwork.github.io/Radio/programmes.html" class="nav-link text-xs font-bold uppercase tracking-wider text-black">REPLAY & STREAMING</a>
        <a href="https://furnalitynetwork.github.io/Radio/grille.html" class="nav-link text-xs font-bold uppercase tracking-wider text-gray-600 hover:text-black">GRILLE</a>
      </div>

      <div class="flex items-center gap-3 flex-shrink-0">
        <a href="https://furnalitynetwork.github.io/Zapping" class="secondary-button hidden lg:inline-flex">Voir sur Zapping</a>
        <button id="menu-button" type="button" class="inline-flex h-10 w-10 items-center justify-center border border-gray-200 lg:hidden" aria-label="Ouvrir le menu">
          <i data-lucide="menu" width="18" height="18"></i>
        </button>
      </div>
    </nav>
    <div class="h-0.5 w-full radio-accent-bar absolute bottom-0 left-0"></div>
  </header>

  <main class="pt-20 flex-grow">
    <section class="px-6 py-12 md:px-12 border-b border-gray-200">
      <div class="max-w-7xl mx-auto">
        <p class="eyebrow mb-2" style="color:#5a189a;">Audio à la demande & Flux</p>
        <h1 class="text-3xl md:text-5xl font-bold text-black">Replay & Streaming Audio.</h1>
        <p class="mt-3 text-sm md:text-base text-gray-600 max-w-2xl">
          Retrouvez les podcasts, émissions radio et sessions audio diffusés par Furnality Radio et le réseau RFF[cite: 18].
        </p>
      </div>
    </section>

    <section class="py-12 px-6 md:px-12">
      <div class="max-w-7xl mx-auto">
        <div id="radio-shows-grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
      </div>
    </section>
  </main>

  <div id="radio-dock" class="fixed bottom-0 left-0 right-0 z-40 bg-black text-white border-t-2 px-4 py-3 md:px-12" style="border-top-color:#004dff;">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0">
        <img id="dock-logo" src="https://raw.githack.com/FurnalityNetwork/Asset/main/Assets/STD/RADIO/RFF/Furnality%20Radio%20-%20Radio%20Alt.svg" alt="" class="h-7 w-auto object-contain flex-shrink-0" onerror="this.style.display='none'">
        <div class="min-w-0">
          <p id="dock-station-name" class="text-xs font-bold uppercase tracking-wider truncate">Furnality Radio — Direct</p>
          <p id="dock-status" class="text-[11px] text-gray-400 truncate">Prêt à l'écoute</p>
        </div>
      </div>
      <button id="dock-toggle-btn" type="button" class="px-4 py-2 text-xs font-bold uppercase tracking-wider text-white" style="background-color:#004dff;">
        Lecture / Pause
      </button>
      <audio id="radio-audio-element" preload="none" class="hidden"></audio>
    </div>
  </div>

  <script src="https://raw.githack.com/FurnalityNetwork/Asset/main/js/radio.js?v=1"></script>
</body>
</html>
